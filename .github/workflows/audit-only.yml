name: Audit only (no deployment)
on:
  push:
    branches: [development-audit]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audit-only-${{ github.ref }}
  cancel-in-progress: true
jobs:
  isolated-tests:
    if: github.ref == 'refs/heads/development-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: bfk_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bfk_audit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BFK_TEST_DATABASE_URL: postgres://postgres:local_test_only@127.0.0.1:5432/bfk_audit
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Prepare disposable database roles
        env:
          PGPASSWORD: local_test_only
        run: |
          psql -h 127.0.0.1 -U postgres -d bfk_audit -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN; CREATE ROLE authenticated NOLOGIN;"
      - run: bun run test:integration
      - name: Rehearse upgrade from deployed schema with legacy records
        env:
          PGPASSWORD: local_test_only
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE bfk_audit_upgrade;"
          BFK_TEST_DATABASE_URL=postgres://postgres:local_test_only@127.0.0.1:5432/bfk_audit_upgrade bun scripts/test-upgrade.mjs
      - name: Install isolated browser test runner
        run: |
          npm install --prefix "$RUNNER_TEMP/bfk-browser" --no-save --package-lock=false playwright@1.56.1
          command -v google-chrome || command -v chromium || node "$RUNNER_TEMP/bfk-browser/node_modules/playwright/cli.js" install chromium
      - name: Prepare fresh browser database
        env:
          PGPASSWORD: local_test_only
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE bfk_audit_browser;"
      - name: Browser smoke test (local only)
        env:
          DATABASE_URL: postgres://postgres:local_test_only@127.0.0.1:5432/bfk_audit_browser
          ADMIN_SESSION_SECRET: audit-browser-local-only-0123456789abcdef
          BFK_BROWSER_PASSWORD: browser-qa-only
        run: |
          export ADMIN_PASSWORD_HASH="$(node -e 'const c=require("node:crypto");const salt=c.randomBytes(16).toString("hex");process.stdout.write(salt+":"+c.scryptSync(process.env.BFK_BROWSER_PASSWORD,salt,32).toString("hex"))')"
          export BFK_PLAYWRIGHT_PATH="$RUNNER_TEMP/bfk-browser/node_modules/playwright"
          export BFK_CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          bun scripts/dev-server.mjs > /tmp/bfk-api.log 2>&1 & api_pid=$!
          bun x vite preview --host 127.0.0.1 --port 4173 > /tmp/bfk-vite.log 2>&1 & vite_pid=$!
          trap 'kill "$api_pid" "$vite_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null && curl -fsS -H 'Content-Type: application/json' -d '{"action":"getSettings","args":{}}' http://127.0.0.1:4173/api/actions >/dev/null; then break; fi
            sleep 1
          done
          node scripts/test-browser.mjs || { cat /tmp/bfk-api.log; cat /tmp/bfk-vite.log; exit 1; }
